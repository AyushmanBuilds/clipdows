<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ClipDows Dashboard</title>
<link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="3" width="14" height="18" rx="3" stroke="url(#g1)" stroke-width="1.6"/>
          <path d="M9 2.5h4a1 1 0 0 1 1 1V5H8V3.5a1 1 0 0 1 1-1Z" fill="url(#g1)"/>
          <path d="M14 14c1.8-1.6 4-1.4 5.2.3M19.2 14.3v-2.1M19.2 14.3h-2.1" stroke="url(#g1)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="g1" x1="4" y1="3" x2="20" y2="21" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6EE7F9"/><stop offset="1" stop-color="#8B5CF6"/>
            </linearGradient>
          </defs>
        </svg>
        <span>ClipDows</span>
      </div>

      <nav class="nav-group" id="navGroup">
        <button class="nav-item active" data-type="all">
          <span class="nav-icon">🗂️</span><span>All Items</span><span class="nav-count" id="count-all">0</span>
        </button>
        <button class="nav-item" data-type="pinned">
          <span class="nav-icon">📌</span><span>Pinned</span><span class="nav-count" id="count-pinned">0</span>
        </button>
        <button class="nav-item" data-type="text">
          <span class="nav-icon">📝</span><span>Text</span><span class="nav-count" id="count-text">0</span>
        </button>
        <button class="nav-item" data-type="link">
          <span class="nav-icon">🔗</span><span>Links</span><span class="nav-count" id="count-link">0</span>
        </button>
        <button class="nav-item" data-type="image">
          <span class="nav-icon">🖼️</span><span>Images</span><span class="nav-count" id="count-image">0</span>
        </button>
        <button class="nav-item" data-type="code">
          <span class="nav-icon">💻</span><span>Code</span><span class="nav-count" id="count-code">0</span>
        </button>
        <button class="nav-item" data-type="file">
          <span class="nav-icon">📄</span><span>Files</span><span class="nav-count" id="count-file">0</span>
        </button>
        <button class="nav-item" data-type="snippet">
          <span class="nav-icon">⭐</span><span>Snippets</span><span class="nav-count" id="count-snippet">0</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item" data-type="trash">
          <span class="nav-icon">🗑️</span><span>Trash</span><span class="nav-count" id="count-trash">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sync-pill">
          <span class="dot"></span> Synced locally
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="search-row">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
            <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input id="searchInput" type="text" placeholder="Search your clipboard… (Ctrl+F)" />
        </div>
        <div class="view-toggle">
          <button class="view-btn active" id="gridViewBtn" title="Grid view">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <button class="view-btn" id="listViewBtn" title="List view">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M5 6h14M5 12h14M5 18h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <button class="primary-btn" id="newSnippetBtn">+ New Snippet</button>
      </header>

      <div class="content" id="content">
        <section class="pinned-section" id="pinnedSection">
          <h3>⭐ Pinned</h3>
          <div class="grid" id="pinnedGrid"></div>
        </section>

        <section class="recent-section">
          <h3 id="sectionTitle">Recent Items</h3>
          <div class="grid" id="itemsGrid"></div>
          <div class="empty-state" id="emptyState" hidden>
            <div class="empty-icon">📋</div>
            <p>Nothing here yet</p>
            <span>Copy something on your device — it'll show up instantly.</span>
          </div>
        </section>
      </div>
    </main>

    <aside class="detail-panel" id="detailPanel" hidden>
      <div class="detail-header">
        <button class="icon-btn" id="detailBack">←</button>
        <span class="detail-type-chip" id="detailTypeChip">Text</span>
        <button class="icon-btn" id="detailClose">✕</button>
      </div>
      <div class="detail-meta" id="detailMeta">22 Sep 2026, 10:24 AM</div>
      <div class="detail-body" id="detailBody"></div>
      <div class="detail-count" id="detailCount"></div>
      <div class="detail-actions">
        <button class="ghost-btn" id="detailCopy">Copy again</button>
        <button class="primary-btn wide" id="detailPaste">Paste now</button>
      </div>
      <div class="detail-tools">
        <button class="tool-btn" id="detailPin">📌 Pin</button>
        <button class="tool-btn danger" id="detailTrash">🗑 Delete</button>
      </div>
    </aside>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
